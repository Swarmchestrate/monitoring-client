[project]
name = "swchmonclient"
version = "0.1.0"
description = "Kubernetes manifest deploy, readiness monitoring, threaded exporter integration, and cleanup tooling."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
authors = [
  {name = "Márk Emődi", email = "mark.emodi@sztaki.hun-ren.hu"}
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent"
]
dependencies = [
  "kubernetes>=26.0.0",
  "pyyaml>=6.0",
  "jinja2>=3.0",
  "stomp.py>=8.2.0",
  "python-dotenv>=1.2.2",
]

[build-system]
requires = ["hatchling>=1.16"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-urls = true

[tool.hatch.build.targets.wheel]
packages = ["src/swchmonclient"]

[tool.hatch.build.targets.sdist]
include = [
  "src/swchmonclient",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]
