apiVersion: v1
kind: ServiceAccount
metadata:
  name: raw-local-listener
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: raw-local-listener-node-reader
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: raw-local-listener-node-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: raw-local-listener-node-reader
subjects:
  - kind: ServiceAccount
    name: raw-local-listener
    namespace: default
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: raw-local-listener
  labels:
    app: raw-local-listener
spec:
  selector:
    matchLabels:
      app: raw-local-listener
  template:
    metadata:
      labels:
        app: raw-local-listener
    spec:
      serviceAccountName: raw-local-listener
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: raw-local-listener
          image: cloud-193-225-250-99.sztaki.science-cloud.hu/swarchestrate/mon_lib:test
          imagePullPolicy: Always
          env:
            - name: MON_CLIENT_STOMP_PORT
              value: "61610"
            - name: MON_CLIENT_STOMP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: stomp-credentials
                  key: username
                  optional: true
            - name: MON_CLIENT_STOMP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stomp-credentials
                  key: password
                  optional: true
